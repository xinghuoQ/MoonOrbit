<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MoonOrbit 月轨 — 由 MoonBit 1.0 驱动的双链 Markdown 编辑器与局部关系图谱。">
  <title>MoonOrbit · 月轨 — 双链 Markdown 编辑器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='10' fill='%232f63e8'/%3E%3Cellipse cx='24' cy='24' rx='21' ry='9' fill='none' stroke='%235b8cff' stroke-width='2' stroke-dasharray='3 4' transform='rotate(-24 24 24)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <!-- ---------------------------------------------------------------- -->
    <!-- Left pane: vault, search, unresolved links                       -->
    <!-- ---------------------------------------------------------------- -->
    <aside class="pane pane-left" aria-label="笔记库">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <defs>
              <radialGradient id="brand-moon" cx="35%" cy="30%" r="80%">
                <stop offset="0%" stop-color="#cfe0ff"/>
                <stop offset="55%" stop-color="#5b8cff"/>
                <stop offset="100%" stop-color="#2f63e8"/>
              </radialGradient>
            </defs>
            <ellipse cx="24" cy="24" rx="21" ry="9.5" fill="none" stroke="#b9cdf7" stroke-width="1.4" stroke-dasharray="2.5 4" transform="rotate(-24 24 24)"/>
            <circle cx="24" cy="24" r="9.5" fill="url(#brand-moon)"/>
            <circle cx="20.5" cy="20.5" r="2.4" fill="#ffffff" opacity=".55"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>MoonOrbit <span>· 月轨</span></h1>
          <span class="brand-badge">Powered by MoonBit 1.0</span>
        </div>
      </header>

      <div class="left-search">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12.6 12.6 17 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="search" placeholder="搜索标题、正文或标签…" autocomplete="off" aria-label="搜索笔记">
      </div>

      <div class="left-actions">
        <button id="new-note-btn" type="button" class="btn btn-primary" title="新建文档（Ctrl+N）" aria-keyshortcuts="Control+N Meta+N">+ 新建文档</button>
        <button id="new-folder-btn" type="button" class="btn btn-soft">+ 新建文件夹</button>
      </div>

      <div class="left-actions left-actions-secondary">
        <button id="import-btn" type="button" class="btn btn-soft">导入 .md</button>
        <button id="export-btn" type="button" class="btn btn-soft" title="导出当前文档（Ctrl+S）" aria-keyshortcuts="Control+S Meta+S">导出 .md</button>
        <button id="reset-sample-btn" type="button" class="btn btn-soft">重置示例</button>
      </div>
      <input id="import-input" type="file" accept=".md,text/markdown" multiple hidden>

      <div class="tag-filter">
        <div class="tag-filter-head">
          <span>标签筛选</span>
          <span id="tag-filter-state" class="tag-filter-state">全部</span>
        </div>
        <div id="tag-bar" class="tag-bar" role="group" aria-label="按标签筛选文档"></div>
      </div>

      <div class="section-head">
        <span>资源管理器</span>
        <span id="note-count" class="count">0</span>
      </div>
      <ul id="folder-tree" class="folder-tree" aria-label="文件夹与 Markdown 文档"></ul>

      <div class="section-head section-head-ghost">
        <span>未创建链接</span>
        <span id="unresolved-count" class="count">0</span>
      </div>
      <ul id="unresolved-list" class="unresolved-list" aria-label="未创建链接"></ul>

      <footer class="pane-foot">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="engine-status">MoonBit 引擎 · JS 目标</span>
      </footer>
    </aside>

    <!-- ---------------------------------------------------------------- -->
    <!-- Center pane: MarkText-style editor and live preview               -->
    <!-- ---------------------------------------------------------------- -->
    <main class="pane pane-center" aria-label="编辑器">
      <div id="engine-alert" class="engine-alert" role="alert" hidden></div>

      <header class="editor-head">
        <input id="title-input" class="title-input" type="text" placeholder="笔记标题" autocomplete="off" aria-label="笔记标题">
        <label class="folder-select-wrap">
          <span class="folder-select-label">所属文件夹</span>
          <select id="folder-select" class="folder-select" aria-label="当前文档所属文件夹"></select>
        </label>
        <div class="view-switch" role="group" aria-label="视图模式">
          <button type="button" data-mode="split" class="is-active" aria-pressed="true">分屏对照</button>
          <button type="button" data-mode="edit" aria-pressed="false">纯编辑</button>
          <button type="button" data-mode="preview" aria-pressed="false">纯预览</button>
        </div>
      </header>

      <div class="format-bar" role="toolbar" aria-label="Markdown 快捷格式">
        <button type="button" data-format="heading" title="插入二级标题">H2</button>
        <button type="button" data-format="bold" title="粗体（Ctrl/Cmd + B）"><b>B</b></button>
        <button type="button" data-format="italic" title="斜体（Ctrl/Cmd + I）"><i>I</i></button>
        <button type="button" data-format="code" title="代码块"><span class="mono">&lt;/&gt;</span></button>
        <span class="format-divider" aria-hidden="true"></span>
        <button type="button" data-format="wikilink" title="插入双链">[[ ]]</button>
        <span class="format-hint">选中文字后点击按钮即可包裹格式</span>
      </div>

      <div id="editor-body" class="editor-body" data-mode="split">
        <section class="editor-pane" aria-label="Markdown 编辑区">
          <textarea id="editor" spellcheck="false" placeholder="# 开始写作…&#10;&#10;使用 [[双链]] 连接其他笔记，使用 #标签 分类。"></textarea>
        </section>
        <section class="preview-pane" aria-label="实时预览">
          <article id="preview" class="markdown-body"></article>
        </section>
      </div>

      <section class="backlinks" aria-label="反向链接">
        <header class="backlinks-head">
          <span>反向链接</span>
          <span id="backlink-count" class="count">0</span>
          <span class="backlinks-hint">引用当前笔记的笔记</span>
        </header>
        <ul id="backlink-list" class="backlink-list"></ul>
      </section>
    </main>

    <!-- ---------------------------------------------------------------- -->
    <!-- Right pane: Obsidian-style local graph                            -->
    <!-- ---------------------------------------------------------------- -->
    <aside class="pane pane-right" aria-label="局部关系图谱">
      <header class="graph-head">
        <div class="graph-titles">
          <h2>局部关系图谱</h2>
          <p>以当前笔记为中心的邻近星图</p>
        </div>
        <div class="graph-controls">
          <div class="depth-switch" role="group" aria-label="图谱深度">
            <button type="button" data-depth="1" class="is-active" aria-pressed="true">1 跳</button>
            <button type="button" data-depth="2" aria-pressed="false">2 跳</button>
          </div>
        </div>
      </header>

      <div class="legend" aria-label="图例">
        <span><i class="dot dot-center"></i>中心节点</span>
        <span><i class="dot dot-hop1"></i>1 跳</span>
        <span><i class="dot dot-hop2"></i>2 跳</span>
        <span><i class="dot dot-ghost"></i>未创建</span>
      </div>

      <div id="graph-canvas" class="graph-canvas">
        <div class="graph-tools" role="group" aria-label="图谱视图控制">
          <button id="graph-zoom-in" type="button" title="放大" aria-label="放大图谱">+</button>
          <button id="graph-zoom-out" type="button" title="缩小" aria-label="缩小图谱">−</button>
          <button id="graph-reset" type="button" title="重置居中" aria-label="重置并居中图谱">⌂</button>
        </div>
        <svg id="graph-svg" role="img" aria-label="笔记关系图"></svg>
        <div id="graph-empty" class="graph-empty" hidden>当前笔记还没有可展示的链接。</div>
      </div>

      <footer class="graph-foot">
        <span id="graph-meta">0 节点 · 0 连线</span>
        <span class="graph-tip">滚轮缩放 · 拖拽空白平移 · 拖动节点调整</span>
      </footer>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
